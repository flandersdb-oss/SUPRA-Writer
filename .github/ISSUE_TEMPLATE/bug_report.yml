name: Bug report
description: Report an application error or broken document behavior
title: '[Bug] '
labels: []
body:
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Explain what you expected and what occurred, without uploading private documents.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: '1. Open app... 2. Select... 3. Save...'
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Browser and operating system
      placeholder: 'Chrome 126 on Windows 11'
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or console errors (optional)
